<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Smart Restaurant Finder</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/shared-styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #5a6f4c 0%, #7a8f6c 100%);
            min-height: 100vh;
            padding-top: 80px;
            /* Space for fixed header */
        }

        .page-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
            padding: 2rem;
        }

        .signup-container {
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            text-align: center;
            color: #5a6f4c;
            margin-bottom: 2rem;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            margin-bottom: 2rem;
            color: #333;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #5a6f4c;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background-color: #d4792e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #b86524;
        }

        .link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .link a {
            color: #5a6f4c;
            text-decoration: none;
            font-weight: 500;
        }

        .link a:hover {
            text-decoration: underline;
        }

        .error {
            background-color: #fee;
            border: 1px solid #fcc;
            padding: 0.75rem;
            border-radius: 8px;
            color: #c33;
            margin-bottom: 1rem;
            display: none;
        }

        .success {
            background-color: #efe;
            border: 1px solid #cfc;
            padding: 0.75rem;
            border-radius: 8px;
            color: #3c3;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>

<body>
    <!-- Shared header will be inserted here by header.js -->

    <div class="page-container">
        <div class="signup-container">
            <div class="logo">🍽️ Smart Restaurant Finder</div>
            <h2>Create Account</h2>

            <div id="errorMessage" class="error"></div>
            <div id="successMessage" class="success"></div>

            <form id="signupForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="your@email.com">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="+1 (555) 123-4567">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••" minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn">Sign Up</button>
            </form>

            <div class="link">
                <a href="/login">Already have an account? Login</a>
            </div>
        </div>
    </div>

    <script src="/js/api-client.js"></script>

    <script>

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorEl = document.getElementById('errorMessage');
            const successEl = document.getElementById('successMessage');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            // Validation
            if (password !== confirmPassword) {
                errorEl.textContent = 'Passwords do not match!';
                errorEl.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                errorEl.textContent = 'Password must be at least 6 characters long!';
                errorEl.style.display = 'block';
                return;
            }

            try {
                const userData = {
                    name: name,
                    email: email,
                    phone: phone || null,
                    password: password
                };

                const response = await api.register(userData);

                if (response && response.user) {
                    // Save auth state (user needs to verify OTP before full access)
                    api.saveAuth(response.user, response.user.UserID);

                    // Store email for OTP verification
                    localStorage.setItem('pendingVerificationEmail', email);

                    successEl.textContent = `Account created! OTP sent to ${email}. Redirecting to verification...`;
                    successEl.style.display = 'block';

                    // Redirect to OTP verification page
                    setTimeout(() => {
                        window.location.href = '/verify-otp';
                    }, 2000);
                } else {
                    errorEl.textContent = 'Registration failed. Please try again.';
                    errorEl.style.display = 'block';
                }
            } catch (error) {
                errorEl.textContent = `Registration failed: ${error.message}. Please configure your database.`;
                errorEl.style.display = 'block';
                console.error('Registration error:', error);
            }
        });
    </script>
</body>

</html>
