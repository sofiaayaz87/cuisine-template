<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Restaurant Finder</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/shared-styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #5a6f4c 0%, #7a8f6c 100%);
            min-height: 100vh;
            padding-top: 80px;
            /* Space for fixed header */
        }

        .page-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
        }

        .login-container {
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            text-align: center;
            color: #5a6f4c;
            margin-bottom: 2rem;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            margin-bottom: 2rem;
            color: #333;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #5a6f4c;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background-color: #d4792e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #b86524;
        }

        .divider {
            text-align: center;
            margin: 1.5rem 0;
            color: #999;
        }

        .link {
            text-align: center;
            margin-top: 1rem;
        }

        .link a {
            color: #5a6f4c;
            text-decoration: none;
            font-weight: 500;
        }

        .link a:hover {
            text-decoration: underline;
        }

        .error {
            background-color: #fee;
            border: 1px solid #fcc;
            padding: 0.75rem;
            border-radius: 8px;
            color: #c33;
            margin-bottom: 1rem;
            display: none;
        }

        .success {
            background-color: #efe;
            border: 1px solid #cfc;
            padding: 0.75rem;
            border-radius: 8px;
            color: #3c3;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>

<body>
    <!-- Shared header will be inserted here by header.js -->

    <div class="page-container">
        <div class="login-container">
            <div class="logo">🍽️ Smart Restaurant Finder</div>
            <h2>Welcome Back</h2>

            <div id="errorMessage" class="error"></div>
            <div id="successMessage" class="success"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="your@email.com">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn">Login</button>
            </form>

            <div class="divider">or</div>

            <div class="link">
                <a href="/signup.html">Don't have an account? Sign up</a>
            </div>

            <div class="link">
                <a href="/restaurants">Continue as guest</a>
            </div>
        </div>
    </div>

    <script src="/js/api-client.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMessage');
            const successEl = document.getElementById('successMessage');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            try {
                const response = await api.login(email, password);

                if (response && response.user) {
                    // Save auth state using API client method
                    api.saveAuth(response.user, response.user.UserID);

                    successEl.textContent = 'Login successful! Redirecting...';
                    successEl.style.display = 'block';

                    // Redirect to restaurants page
                    setTimeout(() => {
                        window.location.href = '/restaurants';
                    }, 1000);
                } else {
                    errorEl.textContent = 'Invalid credentials';
                    errorEl.style.display = 'block';
                }
            } catch (error) {
                errorEl.textContent = `Login failed: ${error.message}. Please configure your database.`;
                errorEl.style.display = 'block';
                console.error('Login error:', error);
            }
        });
    </script>
</body>

</html>
