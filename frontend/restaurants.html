<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Restaurants - Smart Restaurant Finder</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #f8f6f3;
            color: #333;
        }

        .header {
            background-color: #5a6f4c;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 500;
        }

        .nav {
            display: flex;
            gap: 2rem;
        }

        .nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        .hero {
            background: linear-gradient(135deg, #5a6f4c 0%, #7a8f6c 100%);
            color: white;
            padding: 4rem 2rem;
            text-align: center;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .search-container {
            max-width: 600px;
            margin: 2rem auto 0;
            display: flex;
            gap: 1rem;
        }

        .search-input {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
        }

        .search-btn, .location-btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            background-color: #d4792e;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .search-btn:hover, .location-btn:hover {
            background-color: #b86524;
        }

        .main-content {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        .filters {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .restaurant-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .restaurant-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            cursor: pointer;
        }

        .restaurant-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .restaurant-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #e0e0e0;
        }

        .restaurant-info {
            padding: 1.5rem;
        }

        .restaurant-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .restaurant-details {
            color: #666;
            margin-bottom: 0.5rem;
        }

        .rating {
            color: #d4792e;
            font-weight: 600;
        }

        .distance {
            color: #5a6f4c;
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: #666;
        }

        .error {
            background-color: #fee;
            border: 1px solid #fcc;
            padding: 1rem;
            border-radius: 8px;
            color: #c33;
            margin: 1rem 0;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Smart Restaurant Finder</div>
        <nav class="nav">
            <a href="/">Home</a>
            <a href="/restaurants.html">Restaurants</a>
            <a href="/menu/">Menu</a>
            <a href="/book/">Book Table</a>
            <a href="/login.html">Login</a>
        </nav>
    </div>

    <div class="hero">
        <h1>Discover Your Next Favorite Restaurant</h1>
        <p>Find the perfect dining experience near you</p>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search restaurants, cuisine, location...">
            <button class="search-btn" onclick="searchRestaurants()">Search</button>
            <button class="location-btn" onclick="findNearby()">📍 Nearby</button>
        </div>
    </div>

    <div class="main-content">
        <div id="errorContainer"></div>
        <div id="loadingContainer" class="loading" style="display: none;">
            Loading restaurants...
        </div>
        <div id="restaurantGrid" class="restaurant-grid"></div>
    </div>

    <script src="/js/api-client.js"></script>
    <script>
        let currentLocation = null;

        // Load restaurants on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadRestaurants();
        });

        async function loadRestaurants(lat = null, lon = null) {
            const loadingEl = document.getElementById('loadingContainer');
            const gridEl = document.getElementById('restaurantGrid');
            const errorEl = document.getElementById('errorContainer');

            try {
                loadingEl.style.display = 'block';
                gridEl.innerHTML = '';
                errorEl.innerHTML = '';

                const restaurants = await api.getRecommendedRestaurants(lat, lon);

                loadingEl.style.display = 'none';

                if (!restaurants || restaurants.length === 0) {
                    gridEl.innerHTML = '<div class="empty-state"><h2>No restaurants found</h2><p>Try a different search or location</p></div>';
                    return;
                }

                renderRestaurants(restaurants);
            } catch (error) {
                loadingEl.style.display = 'none';
                errorEl.innerHTML = `<div class="error"><strong>Error loading restaurants:</strong> ${error.message}<br><small>Make sure the backend server is running and database is configured.</small></div>`;
                console.error('Error:', error);
            }
        }

        function renderRestaurants(restaurants) {
            const gridEl = document.getElementById('restaurantGrid');
            gridEl.innerHTML = restaurants.map(restaurant => `
                <div class="restaurant-card" onclick="viewRestaurant(${restaurant.RestaurantID})">
                    <div class="restaurant-image" style="background: linear-gradient(135deg, #${Math.floor(Math.random()*16777215).toString(16)} 0%, #${Math.floor(Math.random()*16777215).toString(16)} 100%);"></div>
                    <div class="restaurant-info">
                        <h3 class="restaurant-name">${escapeHtml(restaurant.Name || 'Unknown Restaurant')}</h3>
                        <p class="restaurant-details">${escapeHtml(restaurant.Cuisine || 'Cuisine not specified')}</p>
                        <p class="restaurant-details">${escapeHtml(restaurant.Location || '')}</p>
                        <div class="rating">⭐ ${restaurant.Rating || 'N/A'} / 5</div>
                        ${restaurant.Distance_km ? `<div class="distance">📍 ${restaurant.Distance_km.toFixed(1)} km away</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        async function searchRestaurants() {
            const searchTerm = document.getElementById('searchInput').value;
            if (!searchTerm) {
                loadRestaurants();
                return;
            }

            try {
                const restaurants = await api.searchRestaurants(searchTerm);
                renderRestaurants(restaurants);
            } catch (error) {
                console.error('Search error:', error);
                document.getElementById('errorContainer').innerHTML = `<div class="error">Search failed: ${error.message}</div>`;
            }
        }

        function findNearby() {
            if (navigator.geolocation) {
                document.getElementById('loadingContainer').style.display = 'block';
                navigator.geolocation.getCurrentPosition(
                    position => {
                        currentLocation = {
                            lat: position.coords.latitude,
                            lon: position.coords.longitude
                        };
                        loadRestaurants(currentLocation.lat, currentLocation.lon);
                    },
                    error => {
                        document.getElementById('loadingContainer').style.display = 'none';
                        document.getElementById('errorContainer').innerHTML = `<div class="error">Unable to get your location. Please allow location access.</div>`;
                    }
                );
            } else {
                alert('Geolocation is not supported by your browser');
            }
        }

        function viewRestaurant(id) {
            window.location.href = `/restaurant-detail.html?id=${id}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
